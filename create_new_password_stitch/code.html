<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AuthSys - Create New Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .password-strength-bar {
            height: 4px;
            border-radius: 2px;
            background-color: rgba(255, 255, 255, 0.08);
            transition: background-color 0.3s ease;
        }
        .strength-weak { background-color: #ffb4ab; }
        .strength-medium { background-color: #ffb59e; }
        .strength-strong { background-color: #5edac7; }
        
        body {
            background-color: #0d0d0d;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#353534",
                        "on-primary-container": "#541400",
                        "inverse-surface": "#e5e2e1",
                        "on-error": "#690005",
                        "on-background": "#e5e2e1",
                        "surface-dim": "#131313",
                        "on-secondary": "#313030",
                        "on-tertiary-container": "#00312b",
                        "secondary-fixed-dim": "#c8c6c5",
                        "inverse-primary": "#99462a",
                        "on-secondary-fixed": "#1c1b1b",
                        "background": "#131313",
                        "on-surface-variant": "#dbc1b9",
                        "inverse-on-surface": "#313030",
                        "tertiary-fixed": "#7df7e3",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary": "#c8c6c5",
                        "on-secondary-fixed-variant": "#474746",
                        "on-primary": "#5c1902",
                        "error": "#ffb4ab",
                        "secondary-fixed": "#e5e2e1",
                        "surface-container": "#201f1f",
                        "surface": "#131313",
                        "on-primary-fixed-variant": "#7a2f15",
                        "surface-container-highest": "#353534",
                        "on-tertiary": "#003731",
                        "primary": "#ffb59e",
                        "primary-fixed": "#ffdbd0",
                        "outline": "#a38c85",
                        "surface-tint": "#ffb59e",
                        "on-tertiary-fixed-variant": "#005047",
                        "tertiary": "#5edac7",
                        "outline-variant": "#55433d",
                        "on-tertiary-fixed": "#00201c",
                        "error-container": "#93000a",
                        "primary-container": "#d97757",
                        "on-surface": "#e5e2e1",
                        "tertiary-container": "#09a493",
                        "surface-container-low": "#1c1b1b",
                        "secondary-container": "#474746",
                        "tertiary-fixed-dim": "#5edac7",
                        "surface-container-high": "#2a2a2a",
                        "surface-bright": "#3a3939",
                        "primary-fixed-dim": "#ffb59e",
                        "on-primary-fixed": "#390b00",
                        "on-secondary-container": "#b7b5b4",
                        "on-error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "button-height": "42px",
                        "input-height": "42px",
                        "element-gap": "16px",
                        "unit": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "h2": ["Inter"],
                        "button-text": ["Inter"],
                        "h1": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "input-text": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["10.5px", {"lineHeight": "16px", "letterSpacing": "0.07em", "fontWeight": "500"}],
                        "h2": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "button-text": ["13.5px", {"lineHeight": "1", "fontWeight": "500"}],
                        "h1": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["13.5px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["15px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "input-text": ["13.5px", {"lineHeight": "1", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-[#0d0d0d] text-on-surface min-h-screen flex flex-col font-body-md">
<!-- Top Navigation Bar (Shared Component Style) -->
<header class="flex justify-center items-center py-gutter w-full bg-transparent">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-[20px]" style="font-variation-settings: 'FILL' 1;">pinch</span>
</div>
<span class="font-h1 text-h1 text-primary">AuthSys</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-container-padding py-12">
<div class="w-full max-w-[440px] bg-[#1a1a1a] rounded-xl border border-[rgba(255,255,255,0.08)] p-10 shadow-2xl transition-all duration-300">
<!-- Logo and Wordmark -->
<div class="flex flex-col items-center mb-8">
<div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center mb-4 shadow-[0_0_12px_rgba(217,119,87,0.13)]">
<span class="material-symbols-outlined text-on-primary-container text-[28px]" style="font-variation-settings: 'FILL' 1;">pinch</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface mb-2">Create new password</h1>
<p class="text-on-surface-variant text-body-md text-center">Your new password must be different from previous passwords.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" onsubmit="event.preventDefault();">
<!-- New Password Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block px-1">NEW PASSWORD</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">lock</span>
<input class="w-full h-[42px] bg-[#212121] border border-[rgba(255,255,255,0.08)] rounded-lg pl-10 pr-10 text-input-text focus:outline-none focus:border-primary-container focus:ring-0 transition-all placeholder-[#3a3a4a]" id="new-password" placeholder="Enter new password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword('new-password', this)" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="pt-2 px-1">
<div class="flex gap-1.5 mb-1">
<div class="password-strength-bar flex-grow" id="strength-1"></div>
<div class="password-strength-bar flex-grow" id="strength-2"></div>
<div class="password-strength-bar flex-grow" id="strength-3"></div>
<div class="password-strength-bar flex-grow" id="strength-4"></div>
<div class="password-strength-bar flex-grow" id="strength-5"></div>
</div>
<span class="text-[11px] font-medium text-on-surface-variant" id="strength-label">Security strength</span>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block px-1">CONFIRM NEW PASSWORD</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">lock</span>
<input class="w-full h-[42px] bg-[#212121] border border-[rgba(255,255,255,0.08)] rounded-lg pl-10 pr-10 text-input-text focus:outline-none focus:border-primary-container focus:ring-0 transition-all placeholder-[#3a3a4a]" id="confirm-password" placeholder="Repeat new password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword('confirm-password', this)" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Reset Button -->
<button class="w-full h-[42px] bg-primary-container text-white font-button-text text-button-text rounded-lg hover:brightness-110 active:scale-[0.98] transition-all shadow-[0_0_12px_rgba(217,119,87,0.13)]" type="submit">
                    Reset password
                </button>
<!-- Navigation Link -->
<div class="text-center pt-2">
<a class="inline-flex items-center gap-1.5 text-on-surface-variant hover:text-primary transition-colors text-body-md group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:-translate-x-0.5 transition-transform">arrow_back</span>
                        Back to sign in
                    </a>
</div>
</form>
</div>
</main>
<!-- Footer (Shared Component Style) -->
<footer class="w-full flex flex-col md:flex-row justify-center items-center gap-element-gap py-container-padding bg-transparent mt-auto">
<div class="font-label-caps text-label-caps text-on-surface-variant opacity-70">
            © 2026 AuthSys Inc. All rights reserved.
        </div>
<div class="flex gap-6">
<a class="font-label-caps text-label-caps text-on-secondary-fixed-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-caps text-label-caps text-on-secondary-fixed-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-caps text-label-caps text-on-secondary-fixed-variant hover:text-primary transition-colors" href="#">Contact Support</a>
</div>
</footer>
<script>
        // Password Visibility Toggle
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Real-time Strength Indicator Logic
        const passwordInput = document.getElementById('new-password');
        const bars = [
            document.getElementById('strength-1'),
            document.getElementById('strength-2'),
            document.getElementById('strength-3'),
            document.getElementById('strength-4'),
            document.getElementById('strength-5')
        ];
        const strengthLabel = document.getElementById('strength-label');

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let score = 0;
            if (val.length > 0) score++;
            if (val.length > 8) score++;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            if (val.length > 12) score++;

            // Reset bars
            bars.forEach(bar => bar.className = 'password-strength-bar flex-grow');

            // Apply strength colors
            if (score > 0) {
                for (let i = 0; i < score; i++) {
                    if (score <= 2) {
                        bars[i].classList.add('strength-weak');
                        strengthLabel.innerText = "Weak password";
                        strengthLabel.className = "text-[11px] font-medium text-error";
                    } else if (score <= 4) {
                        bars[i].classList.add('strength-medium');
                        strengthLabel.innerText = "Good password";
                        strengthLabel.className = "text-[11px] font-medium text-primary";
                    } else {
                        bars[i].classList.add('strength-strong');
                        strengthLabel.innerText = "Strong password";
                        strengthLabel.className = "text-[11px] font-medium text-tertiary";
                    }
                }
            } else {
                strengthLabel.innerText = "Security strength";
                strengthLabel.className = "text-[11px] font-medium text-on-surface-variant";
            }
        });
    </script>
</body></html>
