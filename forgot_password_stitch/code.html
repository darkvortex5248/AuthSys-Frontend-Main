<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AuthSys - Forgot Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #0d0d0d;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .accent-glow:focus-within {
            box-shadow: 0 0 12px 0 rgba(217, 119, 87, 0.13);
        }
        .sub-pixel-border {
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .sub-pixel-border:hover {
            border-color: rgba(255, 255, 255, 0.18);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#00201c",
                        "surface-dim": "#131313",
                        "surface": "#131313",
                        "secondary-fixed": "#e5e2e1",
                        "on-secondary-container": "#b7b5b4",
                        "on-primary-fixed": "#390b00",
                        "on-primary-container": "#541400",
                        "outline-variant": "#55433d",
                        "background": "#0d0d0d",
                        "surface-container-high": "#2a2a2a",
                        "primary-fixed": "#ffdbd0",
                        "outline": "#a38c85",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#353534",
                        "on-secondary-fixed": "#1c1b1b",
                        "tertiary-fixed": "#7df7e3",
                        "secondary": "#c8c6c5",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#00312b",
                        "on-secondary-fixed-variant": "#474746",
                        "on-primary-fixed-variant": "#7a2f15",
                        "inverse-surface": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "tertiary": "#5edac7",
                        "on-secondary": "#313030",
                        "inverse-primary": "#99462a",
                        "primary-container": "#d97757",
                        "on-tertiary": "#003731",
                        "surface-container-low": "#1c1b1b",
                        "tertiary-fixed-dim": "#5edac7",
                        "secondary-fixed-dim": "#c8c6c5",
                        "primary-fixed-dim": "#ffb59e",
                        "on-primary": "#5c1902",
                        "surface-variant": "#353534",
                        "on-error": "#690005",
                        "surface-tint": "#ffb59e",
                        "surface-container": "#201f1f",
                        "on-tertiary-fixed-variant": "#005047",
                        "primary": "#ffb59e",
                        "on-surface": "#e5e2e1",
                        "surface-container-lowest": "#0e0e0e",
                        "on-background": "#e5e2e1",
                        "secondary-container": "#474746",
                        "on-surface-variant": "#dbc1b9",
                        "tertiary-container": "#09a493",
                        "surface-bright": "#3a3939"
                    },
                    "borderRadius": {
                        "DEFAULT": "4px",
                        "lg": "8px",
                        "xl": "16px",
                        "full": "9999px"
                    },
                    "spacing": {
                        "button-height": "42px",
                        "gutter": "16px",
                        "container-padding": "24px",
                        "unit": "4px",
                        "input-height": "42px",
                        "element-gap": "16px"
                    },
                    "fontFamily": {
                        "input-text": ["Inter"],
                        "body-md": ["Inter"],
                        "h2": ["Inter"],
                        "h1": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Inter"],
                        "button-text": ["Inter"]
                    },
                    "fontSize": {
                        "input-text": ["13.5px", {"lineHeight": "1", "fontWeight": "400"}],
                        "body-md": ["13.5px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "h2": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "h1": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-lg": ["15px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-caps": ["10.5px", {"lineHeight": "16px", "letterSpacing": "0.07em", "fontWeight": "500"}],
                        "button-text": ["13.5px", {"lineHeight": "1", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-gutter">
<!-- Top Navigation (Suppressed per "The Destination Rule" - Transactional Screen) -->
<main class="flex-grow flex items-center justify-center w-full max-w-[440px]">
<!-- Centered Card Container -->
<div class="w-full bg-[#1a1a1a] p-container-padding rounded-xl sub-pixel-border flex flex-col items-center transition-all duration-300">
<!-- Brand Icon Header -->
<div class="w-12 h-12 bg-[#212121] sub-pixel-border rounded-lg flex items-center justify-center mb-6">
<!-- SVG AuthSys Logo Placeholder using the primary-container color -->
<svg fill="none" height="24" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
<path d="M7 4C7 2.89543 7.89543 2 9 2H15C16.1046 2 17 2.89543 17 4V20C17 21.1046 16.1046 22 15 22H9C7.89543 22 7 21.1046 7 20V4Z" stroke="#d97757" stroke-width="2"></path>
<path d="M7 8H17" stroke="#d97757" stroke-width="2"></path>
<path d="M7 16H17" stroke="#d97757" stroke-width="2"></path>
</svg>
</div>
<div class="text-center mb-8">
<h1 class="font-h1 text-h1 text-on-surface mb-2">Reset password</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
</div>
<!-- Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-[#5a5a72] block tracking-[0.07em]">EMAIL ADDRESS</label>
<div class="relative group accent-glow rounded">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[18px] text-on-secondary-fixed-variant" data-icon="mail">mail</span>
</div>
<input class="w-full h-input-height bg-[#212121] border border-[rgba(255,255,255,0.08)] rounded font-input-text text-input-text text-on-surface placeholder-[#3a3a4a] pl-10 focus:ring-0 focus:border-primary-container transition-all duration-200" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="w-full h-button-height bg-primary-container hover:bg-[#c4664a] active:scale-[0.98] rounded font-button-text text-button-text text-white flex items-center justify-center gap-2 transition-all duration-200" type="submit">
                    Send reset link
                    <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
</form>
<div class="mt-8">
<a class="font-body-md text-body-md text-primary-container hover:text-primary transition-colors flex items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-[16px] transition-transform group-hover:-translate-x-0.5" data-icon="arrow_back">arrow_back</span>
                    Back to sign in
                </a>
</div>
</div>
</main>
<!-- Footer Component Integration from JSON -->
<footer class="fixed bottom-0 left-0 w-full flex flex-col items-center justify-center py-container-padding space-y-2 bg-transparent">
<div class="flex flex-wrap justify-center gap-element-gap">
<a class="font-label-caps text-label-caps text-on-secondary-fixed-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-caps text-label-caps text-on-secondary-fixed-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-caps text-label-caps text-on-secondary-fixed-variant hover:text-primary transition-colors" href="#">Contact Support</a>
</div>
<p class="font-label-caps text-label-caps text-on-surface-variant">© 2026 AuthSys Inc.</p>
</footer>
<!-- Background Atmospheric Effect -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 opacity-30">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container blur-[120px] rounded-full opacity-10"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary blur-[120px] rounded-full opacity-5"></div>
</div>
<script>
        // Simple micro-interaction for the button
        const button = document.querySelector('button');
        button.addEventListener('mousedown', () => {
            button.style.transform = 'scale(0.98)';
        });
        button.addEventListener('mouseup', () => {
            button.style.transform = 'scale(1)';
        });
        button.addEventListener('mouseleave', () => {
            button.style.transform = 'scale(1)';
        });

        // Form submission simulated state
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const originalText = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Sending...';
            
            setTimeout(() => {
                button.classList.remove('bg-primary-container');
                button.classList.add('bg-tertiary-container');
                button.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Link Sent';
                
                setTimeout(() => {
                    button.disabled = false;
                    button.classList.remove('bg-tertiary-container');
                    button.classList.add('bg-primary-container');
                    button.innerHTML = originalText;
                }, 3000);
            }, 1500);
        });
    </script>
</body></html>
